version: 2
updates:
  - package-ecosystem: pip
    directory: "/tests"
    schedule:
      interval: monthly
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      python-test-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
