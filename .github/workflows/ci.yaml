name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

env:
  MEROSS_BROKER_REPO: ${{ github.workspace }}/broker-src

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check out the broker contracts (pinned)
        uses: actions/checkout@v7
        with:
          repository: mazkagaz/meross-local-broker
          ref: c8395c8aca3d19f7f9ec07eca123f0041c046846
          path: broker-src

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements_test.txt

      - name: Check test dependency ownership
        run: |
          if grep -Eq '^(pytest(-cov)?|paho-mqtt)==' tests/requirements_test.txt; then
            echo "pytest, pytest-cov and paho-mqtt must be owned by pytest-homeassistant-custom-component" >&2
            exit 1
          fi
          python -m pip check
          python - <<'PY'
          import importlib.metadata as metadata
          for name in ("pytest", "pytest-cov", "paho-mqtt", "pytest-homeassistant-custom-component"):
              try:
                  print(f"{name}: {metadata.version(name)}")
              except metadata.PackageNotFoundError:
                  raise SystemExit(f"missing test dependency: {name}")
          PY

      - name: Prepare test reports
        run: mkdir -p reports

      - name: Check documentation translations
        run: python tools/check_docs_translations.py

      - name: Full suite with JUnit report
        run: |
          python -m pytest tests -q \
            --junitxml=reports/pytest.xml \
            --cov=custom_components.meross_local_cloud \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-fail-under=85

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-reports
          path: reports/
          if-no-files-found: ignore

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  gate:
    name: CI
    needs:
      - tests
      - hacs
      - hassfest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "One or more CI jobs did not succeed."
            exit 1
          fi
