name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

env:
  MEROSS_BROKER_REPO: ${{ github.workspace }}/broker-src

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check out the broker contracts (pinned)
        uses: actions/checkout@v7
        with:
          repository: mazkagaz/meross-local-broker
          ref: 6a40cef3a62a44813d9ac9b7c1c88e9f2422d6c3
          path: broker-src

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            tests/requirements_test.txt
            tests/constraints_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements_test.txt \
            -c tests/constraints_test.txt

      - name: Prepare test reports
        run: mkdir -p reports

      - name: Check documentation translations
        run: python tools/check_docs_translations.py

      - name: Fast suites (unit and integration)
        run: python -m pytest tests --ignore=tests/functional -q

      - name: Functional scenarios (H2)
        run: |
          python -m pytest tests/functional -q \
            --junitxml=reports/functional.xml

      - name: Full suite with JUnit report
        run: python -m pytest tests -q --junitxml=reports/pytest.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-reports
          path: reports/
          if-no-files-found: ignore

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  gate:
    name: CI
    needs:
      - tests
      - hacs
      - hassfest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "One or more CI jobs did not succeed."
            exit 1
          fi
