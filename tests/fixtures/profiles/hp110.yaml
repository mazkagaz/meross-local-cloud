schema_version: 2
profile:
  id: meross.hp110
  version: "2026.11.0"
  requires_engine: ">=2.2"
  description: "Cherub HP110 : alimentation et éclairage (MP3 non couvert)."
match:
  type: [hp110]
  abilities:
    all: [Appliance.Control.ToggleX, Appliance.Control.Light]
payloads:
  Appliance.Control.ToggleX:
    methods: [GET, SET, GETACK, SETACK, PUSH]
    fields:
      togglex:
        type: array
        items:
          type: object
          fields:
            channel: { type: integer }
            onoff: { type: integer, values: { 0: off, 1: on } }
  Appliance.Control.Light:
    methods: [GET, SET, GETACK, SETACK, PUSH]
    fields:
      light:
        type: object
        fields:
          channel: { type: integer }
          onoff: { type: integer, values: { 0: off, 1: on } }
          luminance: { type: integer, unit: "%" }
          rgb: { type: integer }
          temperature: { type: integer }
          effect: { type: integer }
entities:
  - key: power
    platform: switch
    channel: 0
    name: "Power"
    state:
      namespace: Appliance.Control.ToggleX
      channel: $channel
      select: { path: togglex, key: channel }
      fields: { onoff: onoff }
    commands:
      turn_on:
        namespace: Appliance.Control.ToggleX
        payload:
          { channel: $channel, togglex: [{ channel: $channel, onoff: 1 }] }
      turn_off:
        namespace: Appliance.Control.ToggleX
        payload:
          { channel: $channel, togglex: [{ channel: $channel, onoff: 0 }] }

  - key: light
    platform: light
    channel: 0
    name: "Light"
    state:
      namespace: Appliance.Control.Light
      channel: $channel
      fields:
        onoff: light.onoff
        brightness: light.luminance
        rgb: light.rgb
    commands:
      turn_on:
        namespace: Appliance.Control.Light
        payload: { channel: $channel, light: { onoff: 1 } }
      turn_off:
        namespace: Appliance.Control.Light
        payload: { channel: $channel, light: { onoff: 0 } }
      set_brightness:
        namespace: Appliance.Control.Light
        payload: { channel: $channel, light: { luminance: $value } }
      set_rgb:
        namespace: Appliance.Control.Light
        payload: { channel: $channel, light: { rgb: $value } }
