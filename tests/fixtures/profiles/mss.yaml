schema_version: 2
profile:
  id: meross.mss
  version: "2026.11.0"
  requires_engine: ">=2.2"
  description: "Famille prises et interrupteurs Meross (canal 0)."
match:
  type: [mss, mss2, mss3, mop, p11, r10, r11, r21]
  abilities:
    all: [Appliance.Control.ToggleX]
payloads:
  Appliance.Control.ToggleX:
    methods: [GET, SET, GETACK, SETACK, PUSH]
    digest: digest
    fields:
      channel: { type: integer }
      togglex:
        type: array
        items:
          type: object
          fields:
            channel: { type: integer }
            onoff: { type: integer, values: { 0: off, 1: on } }
entities:
  - key: switch
    platform: switch
    channel: 0
    state:
      namespace: Appliance.Control.ToggleX
      channel: $channel
      fields: { onoff: "togglex[0].onoff" }
    commands:
      turn_on:
        namespace: Appliance.Control.ToggleX
        payload:
          { channel: $channel, togglex: [{ channel: $channel, onoff: 1 }] }
      turn_off:
        namespace: Appliance.Control.ToggleX
        payload:
          { channel: $channel, togglex: [{ channel: $channel, onoff: 0 }] }
