schema_version: 2
profile:
  id: meross.msh300
  version: "2026.11.0"
  requires_engine: ">=2.4"
  description: "Hub MSH300 : sous-appareils MS100 (temp/humidité) et MTS100 (thermostat)."
match:
  kind: hub
  type: [msh]
payloads:
  Appliance.System.Online:
    methods: [GETACK, PUSH]
    fields:
      online:
        type: object
        fields:
          status: { type: integer }
entities:
  - key: online
    platform: binary_sensor
    name: "Hub online"
    device_class: connectivity
    entity_category: diagnostic
    state:
      namespace: Appliance.System.Online
      fields: { value: online.status }
subdevices:
  - name: ms100
    match:
      type: [ms1]
    payloads:
      Appliance.Hub.Sensor.TempHum:
        methods: [GETACK, PUSH]
        fields:
          tempHum:
            type: array
            items:
              type: object
              fields:
                id: { type: string }
                latestTemperature: { type: integer, unit: "°C", scale: 0.1 }
                latestHumidity: { type: integer, unit: "%", scale: 0.1 }
                voltage: { type: integer, unit: V, scale: 0.001 }
    entities:
      - key: temperature
        platform: sensor
        name: "Temperature"
        legacy_classifiers: [temperature, "°C"]
        device_class: temperature
        unit: "°C"
        state:
          namespace: Appliance.Hub.Sensor.TempHum
          fields: { value: latestTemperature }
          scale: 0.1

      - key: humidity
        platform: sensor
        name: "Humidity"
        legacy_classifiers: [humidity, "%"]
        device_class: humidity
        unit: "%"
        state:
          namespace: Appliance.Hub.Sensor.TempHum
          fields: { value: latestHumidity }
          scale: 0.1

      - key: voltage
        platform: sensor
        name: "Voltage"
        legacy_classifiers: [voltage, V]
        device_class: voltage
        unit: V
        entity_category: diagnostic
        state:
          namespace: Appliance.Hub.Sensor.TempHum
          fields: { value: voltage }
          scale: 0.001

  - name: ms130
    match:
      type: [ms130]
    payloads:
      Appliance.Hub.Sensor.All:
        methods: [GET, GETACK, PUSH]
        fields:
          all:
            type: array
            items:
              type: object
              fields:
                id: { type: string }
                temperature:
                  type: object
                  fields:
                    latest: { type: integer, unit: "°C", scale: 0.1 }
                humidity:
                  type: object
                  fields:
                    latest: { type: integer, unit: "%", scale: 0.1 }
    entities:
      - key: temperature
        platform: sensor
        name: "Temperature"
        legacy_classifiers: [temperature, "°C"]
        device_class: temperature
        unit: "°C"
        state:
          namespace: Appliance.Hub.Sensor.All
          fields: { value: temperature.latest }
          scale: 0.1
      - key: humidity
        platform: sensor
        name: "Humidity"
        legacy_classifiers: [humidity, "%"]
        device_class: humidity
        unit: "%"
        state:
          namespace: Appliance.Hub.Sensor.All
          fields: { value: humidity.latest }
          scale: 0.1

  - name: mts100
    match:
      type: [mts1]
    payloads:
      Appliance.Hub.Mts100.All:
        methods: [GET, GETACK, PUSH]
        fields:
          all:
            type: array
            items:
              type: object
              fields:
                id: { type: string }
                mode:
                  type: object
                  fields:
                    state: { type: integer }
                temperature:
                  type: object
                  fields:
                    room: { type: integer }
                    currentSet: { type: integer }
                    heating: { type: integer }
                    min: { type: integer }
                    max: { type: integer }
                togglex:
                  type: object
                  fields:
                    onoff: { type: integer, values: { 0: off, 1: on } }
      Appliance.Hub.Mts100.Mode:
        methods: [GET, SET, GETACK, SETACK, PUSH]
        fields:
          mode:
            type: array
            items:
              type: object
              fields:
                id: { type: string }
                state: { type: integer }
      Appliance.Hub.Mts100.Temperature:
        methods: [GET, SET, GETACK, SETACK, PUSH]
        fields:
          temperature:
            type: array
            items:
              type: object
              fields:
                id: { type: string }
                currentSet: { type: integer }
    entities:
      - key: climate
        platform: climate
        name: "Thermostat"
        capabilities:
          hvac_modes: ["off", heat]
          min_temp: 5
          max_temp: 35
          temp_step: 0.5
        state:
          namespace: Appliance.Hub.Mts100.All
          fields:
            current_temperature: { path: temperature.room, scale: 0.5 }
            target_temperature: { path: temperature.currentSet, scale: 0.5 }
            heating: temperature.heating
            mode: mode.state
            onoff: togglex.onoff
            min_temp: { path: temperature.min, scale: 0.5 }
            max_temp: { path: temperature.max, scale: 0.5 }
        commands:
          turn_on:
            namespace: Appliance.Hub.Mts100.Mode
            payload: { mode: [{ id: $id, state: 1 }] }
          turn_off:
            namespace: Appliance.Hub.Mts100.Mode
            payload: { mode: [{ id: $id, state: 0 }] }
          set_temperature:
            namespace: Appliance.Hub.Mts100.Temperature
            payload: { temperature: [{ id: $id, currentSet: $value }] }
            value_scale: 2

  - name: ms200
    match:
      type: [ms200]
    payloads:
      Appliance.Hub.Sensor.DoorWindow:
        methods: [GETACK, PUSH]
        fields:
          doorWindow:
            type: array
            items:
              type: object
              fields:
                id: { type: string }
                status: { type: integer }
    entities:
      - key: window
        platform: binary_sensor
        name: "Window"
        device_class: window
        state:
          namespace: Appliance.Hub.Sensor.DoorWindow
          fields: { value: status }

  - name: ms400
    match:
      type: [ms400]
    payloads:
      Appliance.Hub.Sensor.WaterLeak:
        methods: [GETACK, PUSH]
        fields:
          waterLeak:
            type: array
            items:
              type: object
              fields:
                id: { type: string }
                latestWaterLeak: { type: integer }
    entities:
      - key: water_leak
        platform: binary_sensor
        name: "Water leak"
        device_class: safety
        state:
          namespace: Appliance.Hub.Sensor.WaterLeak
          fields: { value: latestWaterLeak }

  - name: gs559
    match:
      type: [gs559]
    payloads:
      Appliance.Hub.Sensor.Smoke:
        methods: [GETACK, PUSH]
        fields:
          smokeAlarm:
            type: array
            items:
              type: object
              fields:
                id: { type: string }
                status: { type: integer }
                lmTime: { type: integer }
                interConn: { type: integer }
    entities:
      - key: smoke
        platform: binary_sensor
        name: "Smoke"
        device_class: smoke
        state:
          namespace: Appliance.Hub.Sensor.Smoke
          fields:
            value:
              path: status
              on_values: [23, 24, 25, 26, 27]

      - key: fault
        platform: binary_sensor
        name: "Fault"
        device_class: problem
        entity_category: diagnostic
        state:
          namespace: Appliance.Hub.Sensor.Smoke
          fields:
            value:
              path: status
              on_values: [17, 18, 19, 20, 21, 22]

      - key: muted
        platform: binary_sensor
        name: "Muted"
        entity_category: diagnostic
        state:
          namespace: Appliance.Hub.Sensor.Smoke
          fields:
            value:
              path: status
              on_values: [20, 21, 22, 26, 27]

      - key: interconnect
        platform: sensor
        name: "Interconnect"
        entity_category: diagnostic
        state:
          namespace: Appliance.Hub.Sensor.Smoke
          fields: { value: interConn }

  - name: mst
    match:
      type: [mst100, mst200]
    payloads:
      Appliance.Control.Water:
        methods: [GET, SET, GETACK, SETACK, PUSH]
        fields:
          control:
            type: array
            items:
              type: object
              fields:
                subId: { type: string }
                channel: { type: integer }
                onoff: { type: integer, values: { 1: on, 2: off } }
                dura: { type: integer }
                lmTime: { type: integer }
      Appliance.Control.WaterEvent:
        methods: [GETACK, PUSH]
        fields:
          waterEvent:
            type: array
            items:
              type: object
              fields:
                subId: { type: string }
                wflow: { type: integer }
      Appliance.Config.DeviceCfg:
        methods: [GET, SET, GETACK, SETACK]
        fields:
          config:
            type: array
            items:
              type: object
              fields:
                subId: { type: string }
                channel: { type: integer }
                mstCfg:
                  type: object
                  fields:
                    dura: { type: integer }
                    wfm: { type: integer }
    entities:
      - key: watering
        platform: switch
        name: "Watering"
        state:
          namespace: Appliance.Control.Water
          fields:
            onoff: { path: onoff, on_values: [1] }
        commands:
          turn_on:
            namespace: Appliance.Control.Water
            payload: { control: [{ subId: $id, channel: 0, onoff: 1 }] }
          turn_off:
            namespace: Appliance.Control.Water
            payload: { control: [{ subId: $id, channel: 0, onoff: 2 }] }

      - key: duration
        platform: number
        name: "Watering duration"
        unit: s
        min_value: 1
        max_value: 86400
        step: 1
        state:
          namespace: Appliance.Config.DeviceCfg
          fields: { value: mstCfg.dura }
        commands:
          set_value:
            namespace: Appliance.Config.DeviceCfg
            payload:
              { config: [{ subId: $id, channel: 0, mstCfg: { dura: $value } }] }

      - key: water_flow
        platform: binary_sensor
        name: "Water flow"
        device_class: problem
        entity_category: diagnostic
        state:
          namespace: Appliance.Control.WaterEvent
          fields:
            value: { path: wflow, on_values: [2] }
