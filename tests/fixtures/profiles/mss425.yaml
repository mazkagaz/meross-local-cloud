schema_version: 2
profile:
  id: meross.mss425
  version: "2026.11.0"
  requires_engine: ">=2.3"
  description: "Multiprises mss425/msp844 : une entité par canal exposé."
match:
  type: [mss425, msp844]
  abilities:
    all: [Appliance.Control.ToggleX]
payloads:
  Appliance.Control.ToggleX:
    methods: [GET, SET, GETACK, SETACK, PUSH]
    digest: digest
    fields:
      togglex:
        type: array
        items:
          type: object
          fields:
            channel: { type: integer }
            onoff: { type: integer, values: { 0: off, 1: on } }
entities:
  - key: outlet
    platform: switch
    channel: $channels
    name: "Outlet $channel_number"
    state:
      namespace: Appliance.Control.ToggleX
      channel: $channel
      select: { path: togglex, key: channel }
      fields: { onoff: onoff }
    commands:
      turn_on:
        namespace: Appliance.Control.ToggleX
        payload:
          { channel: $channel, togglex: [{ channel: $channel, onoff: 1 }] }
      turn_off:
        namespace: Appliance.Control.ToggleX
        payload:
          { channel: $channel, togglex: [{ channel: $channel, onoff: 0 }] }
